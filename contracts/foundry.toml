[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.28"
evm_version = "london"
optimizer = true
optimizer_runs = 200
fs_permissions = [{ access = "read", path = "./" }]

[fuzz]
runs = 512

[invariant]
runs = 128
depth = 64
fail_on_revert = false

[rpc_endpoints]
mezo_testnet = "https://rpc.test.mezo.org"
mezo_mainnet = "${MEZO_MAINNET_RPC}"

# Fork runs execute Mezo's deployed MUSD bytecode, which uses post-london opcodes (PUSH0/MCOPY);
# the local EVM must allow them. LockwatchVault itself still targets london in the default profile.
[profile.fork]
evm_version = "cancun"
