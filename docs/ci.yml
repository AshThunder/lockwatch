name: ci
on: [push, pull_request]
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: foundry-rs/foundry-toolchain@v1
      - run: cd contracts && forge build --sizes && forge test --no-match-path 'test/fork/*' -vv
      - run: cd contracts && FOUNDRY_PROFILE=fork forge test --match-path 'test/fork/*' --fork-url https://rpc.test.mezo.org -vv
        continue-on-error: true # public testnet RPC can be flaky
      - uses: crytic/slither-action@v0.4.0
        with: { target: contracts, slither-args: "--exclude-dependencies --filter-paths test", fail-on: high }
  ts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      - run: pnpm -r test
      - run: pnpm --filter @lockwatch/web build
